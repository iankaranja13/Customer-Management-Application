{% extends "base.html" %}

{% block title %}Bad Request (400){% endblock %}

{% block content %}
<div class="card error-card">
    <div class="error-code">400</div>
    <h1 class="error-title">Bad Request</h1>
    <p class="error-message">
        {{ error.description if error and error.description else "Your request could not be processed due to invalid parameters or session expiration." }}
    </p>
    <div class="error-actions">
        <a href="/customers" class="btn btn-primary">Return to Customers</a>
    </div>
</div>
{% endblock %}
